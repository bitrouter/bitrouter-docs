      - Management
      summary: Get settlement for one invoked request
      description: |-
        Returns only a request owned by the exact invoking credential. A request owned by another key is indistinguishable from an absent request (404). The response contains content-free usage, authoritative calculation/collection states, and the complete versioned immutable billing audit when present; it never includes prompt, response, or credential material.

        _Requires the `inference:invoke` scope._
      operationId: getRequestSettlement
      parameters:
      - in: path
        name: request_id
        description: Stable request id returned by the inference API.
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          description: Request-scoped settlement receipt.
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: RequestSettlementResponseDoc
                description: |-
                  Request-scoped settlement receipt returned to the inference credential
                  that invoked the request. No prompt or response payload is exposed.
                type: object
                properties:
                  billing_audit:
                    $ref: '#/$defs/NullableDoc4'
                  billing_collection_status:
                    $ref: '#/$defs/BillingCollectionStatusDoc'
                  billing_fallbacks:
                    $ref: '#/$defs/NullableDoc3'
                  billing_status:
                    $ref: '#/$defs/BillingStatusProjectionDoc'
                  final_charge_micro_usd:
                    $ref: '#/$defs/NullableDoc2'
                  model_id:
                    $ref: '#/$defs/NullableDoc'
                  provider_id:
                    $ref: '#/$defs/NullableDoc'
                  request_id:
                    type: string
                  state:
                    description: |-
                      One of `pending`, `settlement_missing`, `computed`, `not_charged`, or
                      `unknown`.
                    $ref: '#/$defs/RequestSettlementStateDoc'
