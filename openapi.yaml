openapi: 3.1.0
info:
  title: BitRouter API
  description: |-
    The BitRouter API exposes the routing proxy and account-bound services of the hosted BitRouter Cloud node.

    ## Base URL

    ```
    https://api.bitrouter.ai
    ```

    Most endpoints are served under `/v1`. The healthcheck (`/ping`) lives at the root.

    ## Authentication

    Routing endpoints (`/v1/chat/completions`, `/v1/messages`, `/v1/responses`, `/v1beta/models/{model_action}`) accept either:

    - `x-api-key: <api-key>` — Anthropic-compatible header.
    - `Authorization: Bearer <api-key | JWT>` — issued via the BitRouter console or minted from a wallet (CAIP-10 issuer).

    Discovery endpoints (`/v1/models`, `/v1/providers`, `/v1/byok/encryption-pubkey`), the healthcheck, and the scraper-facing `/metrics` are public.

    ## Multi-Protocol Routing

    BitRouter accepts requests in the native format of each supported provider:

    - **OpenAI Chat Completions** — `/v1/chat/completions`
    - **OpenAI Responses** — `/v1/responses`
    - **Anthropic Messages** — `/v1/messages`
    - **Google Generative Language** — `/v1beta/models/{model}:generateContent`

    The router resolves the requested model to a configured upstream provider, forwards the request, and returns the response in the same provider format.
  version: 1.0.0
servers:
- url: https://api.bitrouter.ai
  description: Production
paths:
  /ping:
    get:
      tags:
      - Health
      summary: Liveness check
      description: Returns `200 OK` with an empty body if the node is up.
      operationId: ping
      responses:
        '200':
          description: Node is up.
  /v1/models:
    get:
      tags:
      - Discovery
      summary: List available models
      description: Returns all models available across configured providers. Supports optional query filters for provider, model ID substring, and modality.
      operationId: listModels
      parameters:
      - in: query
        name: provider
        description: Filter by provider name (exact match against the model's `providers` array).
        schema:
          type: string
        style: form
      - in: query
        name: id
        description: Filter by model ID (case-insensitive substring match).
        schema:
          type: string
        style: form
      - in: query
        name: input_modality
        description: Filter by supported input modality (e.g. `text`, `image`).
        schema:
          type: string
        style: form
      - in: query
        name: output_modality
        description: Filter by supported output modality.
        schema:
          type: string
        style: form
      responses:
        '200':
          description: List of models.
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: ModelListResponse
                description: |-
                  Envelope shape for `GET /v1/models`. Wraps the catalogue in `{ "data": [...] }`
                  so future top-level fields (pagination cursors, etc.) can be added without a
                  breaking change.
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/$defs/ModelResponse'
                required:
                - data
                $defs:
                  ContextTier:
                    description: |-
                      A higher context-pricing bracket. Some upstreams bill a model at a steeper
                      rate once the prompt crosses a context-length threshold (e.g. one rate up
                      to 128k input tokens, a higher one between 128k and 256k). The selected
                      bracket's rates apply to the **whole** request — a step function, not
                      graduated marginal brackets — and the bracket is chosen by the request's
                      total input (prompt) token count.

                      Upstreams that publish such tiers:
                      - Alibaba Qwen Model Studio:
                        <https://help.aliyun.com/en/model-studio/models>
                      - Google Gemini API long-context pricing:
                        <https://ai.google.dev/gemini-api/docs/pricing>
                    type: object
                    properties:
                      above_input_tokens:
                        description: |-
                          **Exclusive** lower bound on total input tokens. A request whose input
                          size is strictly greater than this is eligible for the bracket; a
                          request exactly at the bound stays in the lower bracket (so a base
                          bracket documented as "≤ 128k" is expressed as a tier with
                          `above_input_tokens: 128000`).
                        type: integer
                        format: uint64
                        minimum: 0
                      input_tokens:
                        $ref: '#/$defs/InputTokenPricing'
                      output_tokens:
                        $ref: '#/$defs/OutputTokenPricing'
                    required:
                    - above_input_tokens
                  InputTokenPricing:
                    description: Input token pricing per million tokens.
                    type: object
                    properties:
                      cache_read:
                        description: Cost per million cache-read input tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                      cache_write:
                        description: Cost per million cache-write input tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                      no_cache:
                        description: Cost per million non-cached input tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                  ModelFirstTokenLatencyResponse:
                    type: object
                    properties:
                      best_p50_ms:
                        type:
                        - integer
                        - 'null'
                        format: uint64
                        minimum: 0
                      best_p95_ms:
                        type:
                        - integer
                        - 'null'
                        format: uint64
                        minimum: 0
                      sample_count:
                        type: integer
                        format: uint64
                        minimum: 0
                      window_seconds:
                        type: integer
                        format: uint64
                        minimum: 0
                    required:
                    - sample_count
                    - window_seconds
                  ModelLatencyResponse:
                    type: object
                    properties:
                      first_token:
                        $ref: '#/$defs/ModelFirstTokenLatencyResponse'
                    required:
                    - first_token
                  ModelOutputTokenThroughputResponse:
                    type: object
                    properties:
                      best_p50_tokens_per_second:
                        type:
                        - number
                        - 'null'
                        format: double
                      best_p95_tokens_per_second:
                        type:
                        - number
                        - 'null'
                        format: double
                      sample_count:
                        type: integer
                        format: uint64
                        minimum: 0
                      window_seconds:
                        type: integer
                        format: uint64
                        minimum: 0
                    required:
                    - sample_count
                    - window_seconds
                  ModelPricing:
                    description: |-
                      Token pricing per million tokens for a model.

                      `input_tokens`/`output_tokens` are the **base bracket**: the rates for the
                      lowest context range and the fallback when no [`context_tiers`] entry
                      applies. When `context_tiers` is empty the pricing is a single flat rate
                      for every request size (the historical behaviour).

                      [`context_tiers`]: ModelPricing::context_tiers
                    type: object
                    properties:
                      context_tiers:
                        description: |-
                          Optional higher context brackets. Empty ⇒ flat pricing. The registry
                          validator enforces ascending, unique `above_input_tokens` and a
                          complete base bracket, so the per-request resolver does not depend on
                          list order.
                        type: array
                        items:
                          $ref: '#/$defs/ContextTier'
                      input_tokens:
                        $ref: '#/$defs/InputTokenPricing'
                      output_tokens:
                        $ref: '#/$defs/OutputTokenPricing'
                  ModelResponse:
                    type: object
                    properties:
                      capabilities:
                        description: |-
                          Union of inference capabilities advertised across this model's providers
                          (e.g. `structured_outputs`). Omitted when empty.
                        type: array
                        items:
                          type: string
                      description:
                        type:
                        - string
                        - 'null'
                      hosted:
                        description: |-
                          `true` for a hosted (platform-served) model; `false` for a BYOK/
                          BYO-subscription model that only appears when the caller has a key for
                          one of its providers and requires that key to route.
                        type: boolean
                      id:
                        type: string
                      input_modalities:
                        type: array
                        items:
                          type: string
                      latency:
                        $ref: '#/$defs/ModelLatencyResponse'
                      max_input_tokens:
                        type:
                        - integer
                        - 'null'
                        format: uint64
                        minimum: 0
                      max_output_tokens:
                        type:
                        - integer
                        - 'null'
                        format: uint64
                        minimum: 0
                      name:
                        type:
                        - string
                        - 'null'
                      open_weights:
                        description: |-
                          `true` when the model's weights are openly licensed, `false` when they
                          are proprietary. Omitted entirely for models the registry does not
                          declare (external BYOK offerings) — an absent field means "unknown",
                          never "proprietary".
                        type:
                        - boolean
                        - 'null'
                      output_modalities:
                        type: array
                        items:
                          type: string
                      pricing:
                        anyOf:
                        - $ref: '#/$defs/ModelPricing'
                        - type: 'null'
                      providers:
                        $ref: '#/$defs/ProvidersSummary'
                      throughput:
                        $ref: '#/$defs/ModelThroughputResponse'
                    required:
                    - id
                    - input_modalities
                    - output_modalities
                    - capabilities
                    - hosted
                    - providers
                    - latency
                    - throughput
                  ModelThroughputResponse:
                    type: object
                    properties:
                      output_tokens:
                        $ref: '#/$defs/ModelOutputTokenThroughputResponse'
                    required:
                    - output_tokens
                  OutputTokenPricing:
                    description: Output token pricing per million tokens.
                    type: object
                    properties:
                      audio:
                        description: Cost per million audio output tokens. Reserved — see `image`.
                        type:
                        - number
                        - 'null'
                        format: double
                      image:
                        description: |-
                          Cost per million image output tokens. Reserved — not yet wired
                          into `calculate_charge_micro_usd`.
                        type:
                        - number
                        - 'null'
                        format: double
                      reasoning:
                        description: Cost per million reasoning output tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                      text:
                        description: Cost per million text output tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                  ProvidersSummary:
                    type: object
                    properties:
                      total_online:
                        type: integer
                        format: uint
                        minimum: 0
                    required:
                    - total_online
  /v1/providers:
    get:
      tags:
      - Discovery
      summary: List providers
      description: Public registry of providers the node knows about, sourced from the upstream `bitrouter-providers` builtins. Used by the console to render the BYOK page without hard-coding the list.
      operationId: listProviders
      responses:
        '200':
          description: List of providers.
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: ProviderListResponse
                description: |-
                  Envelope for `GET /v1/providers`. Same `{ "data": [...] }` shape as
                  `/v1/models` so the two listings stay consistent for SDK consumers.
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/$defs/ProviderCatalogEntry'
                required:
                - data
                $defs:
                  Access:
                    description: |-
                      How a caller obtains access to a provider — the registration / credential
                      obtainment model. Mirrors the registry `access` field; supersedes the old
                      `byok` boolean. Drives the console BYOK page (lists `api_key` only), the
                      platform pool (skips `local_*`), and the BYOK overlay's security gate.
                      Serialized on the public `/v1/providers` catalog (`Serialize` + `JsonSchema`)
                      so the console can filter the BYOK page on `access === "api_key"` directly.
                    oneOf:
                    - description: Public self-registration → a portable API key (the BYOK case).
                      type: string
                      const: api_key
                    - description: Public, credentials minted by a local browser/device OAuth flow.
                      type: string
                      const: local_oauth
                    - description: Public, credentials minted by a local OAuth+PKCE flow.
                      type: string
                      const: local_pkce
                    - description: No public registration — platform-pooled / invite-only. Never BYOK.
                      type: string
                      const: private
                  ContextTier:
                    description: |-
                      A higher context-pricing bracket. Some upstreams bill a model at a steeper
                      rate once the prompt crosses a context-length threshold (e.g. one rate up
                      to 128k input tokens, a higher one between 128k and 256k). The selected
                      bracket's rates apply to the **whole** request — a step function, not
                      graduated marginal brackets — and the bracket is chosen by the request's
                      total input (prompt) token count.

                      Upstreams that publish such tiers:
                      - Alibaba Qwen Model Studio:
                        <https://help.aliyun.com/en/model-studio/models>
                      - Google Gemini API long-context pricing:
                        <https://ai.google.dev/gemini-api/docs/pricing>
                    type: object
                    properties:
                      above_input_tokens:
                        description: |-
                          **Exclusive** lower bound on total input tokens. A request whose input
                          size is strictly greater than this is eligible for the bracket; a
                          request exactly at the bound stays in the lower bracket (so a base
                          bracket documented as "≤ 128k" is expressed as a tier with
                          `above_input_tokens: 128000`).
                        type: integer
                        format: uint64
                        minimum: 0
                      input_tokens:
                        $ref: '#/$defs/InputTokenPricing'
                      output_tokens:
                        $ref: '#/$defs/OutputTokenPricing'
                    required:
                    - above_input_tokens
                  FirstTokenLatencyMetrics:
                    type: object
                    properties:
                      p50_ms:
                        type:
                        - integer
                        - 'null'
                        format: uint64
                        minimum: 0
                      p95_ms:
                        type:
                        - integer
                        - 'null'
                        format: uint64
                        minimum: 0
                      sample_count:
                        type: integer
                        format: uint64
                        minimum: 0
                    required:
                    - sample_count
                  InputTokenPricing:
                    description: Input token pricing per million tokens.
                    type: object
                    properties:
                      cache_read:
                        description: Cost per million cache-read input tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                      cache_write:
                        description: Cost per million cache-write input tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                      no_cache:
                        description: Cost per million non-cached input tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                  ModelPricing:
                    description: |-
                      Token pricing per million tokens for a model.

                      `input_tokens`/`output_tokens` are the **base bracket**: the rates for the
                      lowest context range and the fallback when no [`context_tiers`] entry
                      applies. When `context_tiers` is empty the pricing is a single flat rate
                      for every request size (the historical behaviour).

                      [`context_tiers`]: ModelPricing::context_tiers
                    type: object
                    properties:
                      context_tiers:
                        description: |-
                          Optional higher context brackets. Empty ⇒ flat pricing. The registry
                          validator enforces ascending, unique `above_input_tokens` and a
                          complete base bracket, so the per-request resolver does not depend on
                          list order.
                        type: array
                        items:
                          $ref: '#/$defs/ContextTier'
                      input_tokens:
                        $ref: '#/$defs/InputTokenPricing'
                      output_tokens:
                        $ref: '#/$defs/OutputTokenPricing'
                  OutputTokenPricing:
                    description: Output token pricing per million tokens.
                    type: object
                    properties:
                      audio:
                        description: Cost per million audio output tokens. Reserved — see `image`.
                        type:
                        - number
                        - 'null'
                        format: double
                      image:
                        description: |-
                          Cost per million image output tokens. Reserved — not yet wired
                          into `calculate_charge_micro_usd`.
                        type:
                        - number
                        - 'null'
                        format: double
                      reasoning:
                        description: Cost per million reasoning output tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                      text:
                        description: Cost per million text output tokens.
                        type:
                        - number
                        - 'null'
                        format: double
                  OutputTokenThroughputMetrics:
                    type: object
                    properties:
                      p50_tokens_per_second:
                        type:
                        - number
                        - 'null'
                        format: double
                      p95_tokens_per_second:
                        type:
                        - number
                        - 'null'
                        format: double
                      sample_count:
                        type: integer
                        format: uint64
                        minimum: 0
                    required:
                    - sample_count
                  ProviderAggregateMetrics:
                    type: object
                    properties:
                      cache_hit_rate:
                        type: number
                        format: double
                      latency:
                        $ref: '#/$defs/ProviderLatencyMetrics'
                      p50_latency_ms:
                        description: |-
                          Request-weighted average of per-model p50 latencies. Not a true
                          cross-bucket p50 (that would need a separate query), but cheap
                          and close enough for a discovery panel.
                        type: integer
                        format: uint64
                        minimum: 0
                      request_count:
                        type: integer
                        format: uint64
                        minimum: 0
                      success_rate:
                        description: |-
                          Successful responses divided by (success + provider_error +
                          timeout). 0.0 when no scored requests fell in the window.
                        type: number
                        format: double
                      throughput:
                        $ref: '#/$defs/ProviderThroughputMetrics'
                    required:
                    - request_count
                    - success_rate
                    - p50_latency_ms
                    - latency
                    - throughput
                    - cache_hit_rate
                  ProviderCatalogEntry:
                    description: One provider as it appears to public discovery clients.
                    type: object
                    properties:
                      access:
                        description: |-
                          How a caller obtains access to this provider — see [`Access`]. Only
                          `api_key` providers accept a bring-your-own-key credential; the console
                          filters its BYOK page on `access == "api_key"`. (`local_oauth` /
                          `local_pkce` providers are not in this catalog at all — the router
                          cannot pool them — so in practice this is `api_key` or `private`.)
                        $ref: '#/$defs/Access'
                      aggregate:
                        $ref: '#/$defs/ProviderAggregateMetrics'
                      byok:
                        description: |-
                          `true` when a caller may bring their own key — derived alias of
                          `access == "api_key"`, kept for back-compat with existing clients.
                          `false` for the platform pool, which routes platform-only.
                        type: boolean
                      community:
                        description: |-
                          `true` for an unaffiliated community reseller; `false` (default) for
                          a first-party or official upstream.
                        type: boolean
                      id:
                        description: 'Stable public handle: the provider''s registry name.'
                        type: string
                      metadata:
                        anyOf:
                        - $ref: '#/$defs/ProviderMetadata'
                        - type: 'null'
                      metrics_window_seconds:
                        type: integer
                        format: uint64
                        minimum: 0
                      models:
                        type: array
                        items:
                          $ref: '#/$defs/ProviderModelCatalogEntry'
                      name:
                        description: |-
                          Human-readable provider name. Always present — providers are no
                          longer anonymized.
                        type: string
                      rate_limit:
                        $ref: '#/$defs/ProviderRateLimit'
                      status:
                        $ref: '#/$defs/ProviderStatus'
                    required:
                    - id
                    - name
                    - community
                    - access
                    - byok
                    - status
                    - rate_limit
                    - metrics_window_seconds
                    - aggregate
                    - models
                  ProviderLatencyMetrics:
                    type: object
                    properties:
                      first_token:
                        $ref: '#/$defs/FirstTokenLatencyMetrics'
                    required:
                    - first_token
                  ProviderMetadata:
                    description: |-
                      Public organization metadata for the provider responsible for a registry
                      `api_base`. Optional policy/status links are descriptive only; routing does
                      not depend on them.
                    type: object
                    properties:
                      headquarters:
                        description: |-
                          ISO 3166-1 alpha-2 country code for the provider organization's
                          headquarters.
                        type: string
                      name:
                        description: Human-readable organization or product name.
                        type: string
                      privacy_policy_url:
                        type:
                        - string
                        - 'null'
                        default: null
                      slug:
                        description: Stable UI/API slug for the organization or product.
                        type: string
                      status_page_url:
                        type:
                        - string
                        - 'null'
                        default: null
                      terms_of_service_url:
                        type:
                        - string
                        - 'null'
                        default: null
                    required:
                    - headquarters
                    - name
                    - slug
                  ProviderModelCatalogEntry:
                    type: object
                    properties:
                      hosted:
                        description: |-
                          `true` when this model is in the hosted set (OSS `models.json`).
                          `false` marks a BYOK/BYO-subscription extra, surfaced only on the
                          caller-scoped view when the caller has a key for this provider.
                        type: boolean
                      id:
                        description: |-
                          Canonical model id (e.g. `claude-sonnet-4-6`). The vendor's own
                          `provider_model_id` is deliberately not exposed.
                        type: string
                      metrics:
                        $ref: '#/$defs/ProviderModelMetrics'
                      pricing:
                        $ref: '#/$defs/ModelPricing'
                    required:
                    - id
                    - hosted
                    - pricing
                    - metrics
                  ProviderModelMetrics:
                    type: object
                    properties:
                      latency:
                        $ref: '#/$defs/ProviderLatencyMetrics'
                      p50_latency_ms:
                        type: integer
                        format: uint64
                        minimum: 0
                      request_count:
                        type: integer
                        format: uint64
                        minimum: 0
                      success_rate:
                        type: number
                        format: double
                      throughput:
                        $ref: '#/$defs/ProviderThroughputMetrics'
                    required:
                    - request_count
                    - success_rate
                    - p50_latency_ms
                    - latency
                    - throughput
                  ProviderRateLimit:
                    type: object
                    properties:
                      current_rpm:
                        description: In-process sliding-window admission count for this provider.
                        type: integer
                        format: uint32
                        minimum: 0
                      declared_rpm:
                        description: |-
                          Provider-wide declared RPM from the wildcard `*` pattern in
                          `rate_limits`. Omitted when the provider's YAML declares no
                          wildcard entry — per-model overrides are intentionally not
                          surfaced, since the response shape is one rate per provider.
                        type:
                        - integer
                        - 'null'
                        format: uint32
                        minimum: 0
                    required:
                    - current_rpm
                  ProviderStatus:
                    description: Provider lifecycle state.
                    type: string
                    enum:
                    - active
                    - staging
                    - suspended
                    - withdrawn
                  ProviderThroughputMetrics:
                    type: object
                    properties:
                      output_tokens:
                        $ref: '#/$defs/OutputTokenThroughputMetrics'
                    required:
                    - output_tokens
  /v1/stats/usage:
    get:
      tags:
      - Discovery
      summary: Platform token usage statistics
      description: |-
        Aggregate token usage across the whole platform for a rolling window, bucketed by day and broken down by model. Public and unauthenticated — these are published figures, not per-account usage; for that see `GET /v1/namespaces/{nsid}/usage`.

        Counts only requests that succeeded. `completion_tokens` already includes `reasoning_tokens`, so `total_tokens` is `prompt_tokens + completion_tokens` — adding reasoning on top double-counts. Served from a 5-minute cache.
      operationId: getUsageStats
      parameters:
      - in: query
        name: days
        description: Window length in days, 1–90 (default 14). Out-of-range values are clamped.
        schema:
          type: string
        style: form
      - in: query
        name: top
        description: How many models to break out per day in `series` before the tail is folded into an `other` bucket, 1–25 (default 8). Does not truncate the `models` array.
        schema:
          type: string
        style: form
      responses:
        '200':
          description: Platform-wide token usage for the requested window.
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: UsageStatsResponse
                type: object
                properties:
                  models:
                    description: |-
                      Every model with traffic in the window, busiest first. Not truncated —
                      `top` only controls the per-day `series` breakdown.
                    type: array
                    items:
                      $ref: '#/$defs/ModelUsage'
                  open_weight_token_share:
                    description: |-
                      Share of `totals.total_tokens` served by open-weight models, over the
                      tokens whose licensing is known. `null` when no such traffic exists in
                      the window — distinct from `0.0`, which means known-and-none.
                    type:
                    - number
                    - 'null'
                    format: double
                  series:
                    type: array
                    items:
                      $ref: '#/$defs/UsageDay'
                  totals:
                    $ref: '#/$defs/UsageTotals'
                  window:
                    $ref: '#/$defs/UsageWindow'
                required:
                - window
                - totals
                - models
                - series
                $defs:
                  ModelUsage:
                    type: object
                    properties:
                      completion_tokens:
                        type: integer
                        format: int64
                      id:
                        type: string
                      open_weights:
                        description: |-
                          Open-weight licensing from the registry; omitted when the model is not
                          a canonical declaration. Absent means unknown, never "proprietary".
                        type:
                        - boolean
                        - 'null'
                      prompt_tokens:
                        type: integer
                        format: int64
                      request_count:
                        type: integer
                        format: int64
                      token_share:
                        description: This model's share of `totals.total_tokens`, 0.0–1.0.
                        type: number
                        format: double
                      total_tokens:
                        type: integer
                        format: int64
                    required:
                    - id
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
                    - request_count
                    - token_share
                  UsageDay:
                    type: object
                    properties:
                      by_model:
                        description: |-
                          Tokens per broken-out model for this day, plus an `other` key carrying
                          the folded tail. Models with no traffic on a given day are omitted
                          rather than reported as zero.
                        type: object
                        additionalProperties:
                          type: integer
                          format: int64
                      date:
                        type: string
                        format: date
                      request_count:
                        type: integer
                        format: int64
                      total_tokens:
                        type: integer
                        format: int64
                    required:
                    - date
                    - total_tokens
                    - request_count
                    - by_model
                  UsageTotals:
                    type: object
                    properties:
                      completion_tokens:
