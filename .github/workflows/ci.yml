name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Must run BEFORE the build: `prebuild` regenerates these tables in
        # place, so a check afterwards would always pass. This compares the
        # committed tables against the committed snapshots — no network — so it
        # catches a hand-edited table or a snapshot refreshed without
        # regenerating, without failing unrelated PRs when upstream prices move.
        # (Upstream drift is absorbed at deploy time by `prebuild`.)
      - run: pnpm lint:tables
        # Enforces the curation gate: a notable/highlight entry that still has
        # its draft banner fails here rather than shipping raw release notes.
      - run: pnpm lint:changelog
        # The vitest suite covers the pipeline modules the generators and CI
        # gates depend on (changelog, docs-sync, llms.txt, x-articles).
      - run: pnpm test
      - run: pnpm build
        env:
          # Authenticates the docs/changelog sync fetches against GitHub
          # (5000/hr) so they don't hit unauthenticated / raw.* rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
