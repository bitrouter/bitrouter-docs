  /v1/messages:
    post:
      tags:
      - Anthropic Compatible
      summary: Create message
      description: |-
        Creates a message using the Anthropic Messages API format. Drop-in replacement for the Anthropic API.

        When `stream: true`, the response is sent as Server-Sent Events (SSE). Each event has a `type` field indicating the event kind (`message_start`, `content_block_delta`, `message_delta`, `message_stop`).
      operationId: createMessage
      requestBody:
        description: Anthropic Messages request.
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: MessagesRequest
              description: |-
                Messages request body (<https://docs.anthropic.com/en/api/messages>).

                `pub` so downstream crates (notably `bitrouter-cloud`) can derive an
                OpenAPI schema from the canonical wire shape without redeclaring it.
              type: object
              properties:
                max_tokens:
                  type:
                  - integer
                  - 'null'
                  format: uint32
                  default: null
                  minimum: 0
                messages:
                  type: array
                  items:
                    $ref: '#/$defs/MessagesMessage'
                model:
                  type: string
                output_config:
                  description: |-
                    Structured-output + reasoning config — `format` (`json_schema`) is
                    promoted to the canonical `response_format` and `effort` to the canonical
                    reasoning effort. Sibling keys pass through via `extra`.
                    <https://platform.claude.com/docs/en/build-with-claude/structured-outputs>
                  anyOf:
                  - $ref: '#/$defs/MessagesOutputConfig'
                  - type: 'null'
                stop_sequences:
                  description: |-
                    Custom stop sequences. Promoted to the canonical `stop` slot, so it can
                    render as a Chat Completions `stop` or a Gemini `stopSequences`.
                    <https://docs.anthropic.com/en/api/messages#body-stop-sequences>
                  type:
                  - array
                  - 'null'
                  default: null
                  items:
                    type: string
                stream:
                  type: boolean
                  default: false
                system:
                  description: 'String or an array of `{type:"text", text}` blocks (#227 → #228).'
                  default: null
                temperature:
                  type:
                  - number
                  - 'null'
                  format: double
                  default: null
                tools:
                  type: array
                  items:
                    $ref: '#/$defs/MessagesTool'
                top_k:
                  description: |-
                    Top-k sampling. Promoted to the canonical `top_k` slot so it translates
                    across protocols (e.g. to a Gemini upstream's `generationConfig.topK`).
                    <https://docs.anthropic.com/en/api/messages#body-top-k>
                  type:
                  - integer
                  - 'null'
                  format: uint32
                  default: null
                  minimum: 0
                top_p:
                  type:
                  - number
                  - 'null'
                  format: double
                  default: null
              required:
              - model
              - messages
              $defs:
                MessagesMessage:
                  description: One element of [`MessagesRequest`]'s `messages` array — a `{ role, content }` turn.
                  type: object
                  properties:
                    content:
                      description: String or an array of content blocks.
                    role:
                      type: string
                  required:
                  - role
                  - content
                MessagesOutputConfig:
                  description: Messages `output_config` — structured output + reasoning effort.
                  type: object
                  properties:
                    effort:
                      description: Reasoning effort (`low` | `medium` | `high` | `xhigh` | `max`).
                      type:
                      - string
                      - 'null'
                      default: null
                    format:
                      anyOf:
                      - $ref: '#/$defs/MessagesOutputFormat'
                      - type: 'null'
                MessagesOutputFormat:
                  description: |-
                    Messages `output_config.format`
                    (<https://platform.claude.com/docs/en/build-with-claude/structured-outputs>).
                    Anthropic's GA structured-output format carries no name / strict.
                  oneOf:
                  - description: JSON constrained to a schema.
                    type: object
                    properties:
                      schema:
                        description: The JSON Schema.
                      type:
                        type: string
                        const: json_schema
                    required:
                    - type
                    - schema
                MessagesTool:
                  description: |-
                    One element of [`MessagesRequest`]'s `tools` array.

                    Anthropic uses one array for both kinds of tool:
                    - a **client (function) tool** — `{name, description?, input_schema}` (no `type`);
                    - a **provider-defined (server) tool** — `{type:"web_search_20250305"|…, name, …config}`
                      (web search, code execution, computer use, bash, text editor), where `type`
                      is the dated tool version and `name` is the stable tool name.

                    A versioned `type` discriminates a server tool; its config keys ride in
                    `extra` so they are preserved verbatim into `Tool::ProviderDefined.args`.
                    <https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview>
                    <https://docs.claude.com/en/docs/agents-and-tools/tool-use/web-search-tool>
                  type: object
                  properties:
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
                    input_schema:
                      default: null
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                    type:
                      type:
                      - string
                      - 'null'
                      default: null
        required: true
      responses:
        '200':
          description: |-
            Messages response (non-streaming).

            Streamed Messages response — Server-Sent Events. Each event has a `type` field (`message_start`, `content_block_delta`, …).
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: MessagesResponseDoc
                description: 'MIRROR: `bitrouter_sdk::language_model::protocol::messages` response'
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/$defs/MessagesContentBlockDoc'
                  id:
                    type: string
                  model:
                    type: string
                  role:
                    description: Always `assistant`.
                    type: string
                  stop_reason:
                    type:
                    - string
                    - 'null'
                  stop_sequence:
                    type:
                    - string
                    - 'null'
                  type:
                    description: Always `message`.
                    type: string
                  usage:
                    $ref: '#/$defs/MessagesUsageDoc'
                required:
                - id
                - type
                - role
                - content
                - model
                - usage
                $defs:
                  MessagesContentBlockDoc:
                    type: object
                    properties:
                      text:
                        type: string
                      type:
                        description: Block type — `text` is the only variant emitted today.
                        type: string
                    required:
                    - type
                    - text
                  MessagesUsageDoc:
                    type: object
                    properties:
                      cache_creation_input_tokens:
                        description: |-
                          Number of tokens written to the prompt cache by this request. Present
                          (non-zero) only when the request enabled prompt caching.
                        type:
                        - integer
                        - 'null'
                        format: uint32
                        minimum: 0
                      cache_read_input_tokens:
                        description: |-
                          Number of tokens read from the prompt cache by this request. Present
                          (non-zero) only when the request reused a cached prompt.
                        type:
                        - integer
                        - 'null'
                        format: uint32
                        minimum: 0
                      input_tokens:
                        type: integer
                        format: uint32
                        minimum: 0
                      output_tokens:
                        type: integer
                        format: uint32
                        minimum: 0
                    required:
                    - input_tokens
                    - output_tokens
            text/event-stream:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: MessagesStreamEventDoc
                description: 'MIRROR: a single SSE event in the streaming `/v1/messages` response.'
                type: object
                properties:
                  delta:
                    anyOf:
                    - $ref: '#/$defs/MessagesStreamDeltaDoc'
                    - type: 'null'
                  index:
                    type:
                    - integer
                    - 'null'
                    format: uint32
                    minimum: 0
                  message:
                    anyOf:
                    - $ref: '#/$defs/MessagesStreamMessageDoc'
                    - type: 'null'
                  type:
                    description: |-
                      Event type — `message_start`, `content_block_delta`, `message_delta`,
                      `message_stop`, etc.
                    type: string
                required:
                - type
                $defs:
                  MessagesStreamDeltaDoc:
                    type: object
                    properties:
                      stop_reason:
                        type:
                        - string
                        - 'null'
                      text:
                        type:
                        - string
                        - 'null'
                      type:
                        type:
                        - string
                        - 'null'
                  MessagesStreamMessageDoc:
                    type: object
                    properties:
                      id:
                        type: string
                      model:
                        type: string
                      role:
                        type: string
                    required:
                    - id
                    - model
                    - role
        '400':
          description: Bad request — invalid model or malformed request body.
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: ErrorResponseDoc
                description: |-
                  MIRROR: the JSON shape `bitrouter_sdk::error::BitrouterError` serialises into
                  (`{ "error": { "code": ..., "message": ..., "type": ... } }`). Cloud handlers map to
                  this envelope via `BitrouterError::into_response`.
                type: object
                properties:
                  error:
                    $ref: '#/$defs/ErrorBodyDoc'
                required:
                - error
                $defs:
                  ErrorBodyDoc:
                    type: object
                    properties:
                      code:
                        description: Stable machine-readable error code (e.g. `upstream_rate_limited`).
                        type: string
                      message:
                        description: Human-readable error description.
                        type: string
                      type:
                        description: Broad OpenAI-compatible error category (e.g. `rate_limit_error`).
                        type: string
                    required:
                    - code
