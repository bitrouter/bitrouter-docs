name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Enforces the curation gate: a notable/highlight entry that still has
        # its draft banner fails here rather than shipping raw release notes.
      - run: pnpm lint:changelog
        # The vitest suite covers the pipeline modules the generators and CI
        # gates depend on (changelog, docs-sync, llms.txt, x-articles).
      - run: pnpm test
      - run: pnpm build
        env:
          # Authenticates the docs/changelog sync fetches against GitHub
          # (5000/hr) so they don't hit unauthenticated / raw.* rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release docs to Railway
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RAILWAY_STAGING_ENABLED == 'true'
    concurrency:
      group: railway-docs-release
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/railway-release.yml
    secrets:
      # GitHub requires this mapping even though each deploy job gets its token
      # from its own environment.
      RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
